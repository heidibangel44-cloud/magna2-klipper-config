# ============================================================================
# CONFIGURACIÓN FUTURA DE SONDA - NO ACTIVA
# ============================================================================
# Este archivo NO se carga todavía. printer.cfg no lo incluye a propósito,
# para que la impresora siga funcionando normalmente (switch mecánico de Z)
# mientras no haya una sonda real instalada y probada.
#
# Investigado 2026-10-25. Opciones comparadas (ver BITACORA.md para fuentes):
#
#   1) BLTouch genuino (Antclabs) - mismo conector de 5 pines que el clon
#      roto actual (PA11 señal / PA8 control). Usa [bltouch]. Más confiable
#      que los clones "3D Touch" baratos, pero sigue siendo un mecanismo con
#      partes móviles (solenoide) que puede fallar con el tiempo.
#   2) Sonda mecánica desmontable (Klicky, Euclid) - usa [probe] genérico,
#      NO [bltouch]. Solo 2 cables (switch simple). Elimina el punto de falla
#      del solenoide. Necesita un mecanismo de dock/acople impreso en 3D y
#      macros de attach/detach adicionales (no incluidas acá todavía).
#   3) Sonda inductiva genérica - usa [probe] directo, 3 cables, 12V o 24V
#      (NO 5V). Solo funciona sobre superficie METÁLICA (no sirve si la cama
#      tiene vidrio/PEI no metálico expuesto donde mida).
#   4) Eddy current (Cartographer/Beacon/BTT Eddy) - la más precisa, pero
#      necesita un MCU adicional propio (toolboard) además del Robin Nano -
#      mucho más cara y compleja. No es necesaria para esta máquina salvo
#      que busquemos precisión de nivel muy alto.
#
# Para la mayoría de casos con esta impresora, un BLTouch GENUINO (opción 1)
# es el reemplazo más directo: mismo conector, misma config base que ya
# teníamos escrita, solo cambia que debería funcionar touch_mode de verdad
# (los clones rotos no). Si se elige otra opción, hay que reescribir esta
# sección de sensor_pin/control_pin acorde.
#
# NO INVENTAR valores de x_offset/y_offset/z_offset - se miden a mano con el
# procedimiento oficial una vez que la sonda esté físicamente instalada:
# https://www.klipper3d.org/Probe_Calibrate.html
# ============================================================================

[bltouch]
sensor_pin: ^PA11
control_pin: PA8
# [PENDIENTE DE MEDIR - no inventar] offset físico real de la sonda
# respecto a la punta de la boquilla, una vez montada:
x_offset: 0
y_offset: 0
z_offset: 0
speed: 1
lift_speed: 1
sample_retract_dist: 2.0
samples: 2
samples_result: average
samples_tolerance: 0.100
samples_tolerance_retries: 0
# Si es un clon sin touch_mode (como el anterior): dejar comentadas estas
# dos líneas de abajo. Si es un BLTouch GENUINO: probar primero con el
# procedimiento oficial de Klipper antes de decidir si hacen falta:
#pin_up_reports_not_triggered: False
#probe_with_touch_mode: False

# [CAMBIO NECESARIO en stepper_z cuando se active esta sonda] En el
# printer.cfg activo, [stepper_z] usa:
#   endstop_pin: ^!PA11          (switch mecánico)
#   position_endstop: 0
# Hay que cambiar a:
#   endstop_pin: probe:z_virtual_endstop
#   (y QUITAR la línea position_endstop - Klipper no permite declararla
#   junto con probe:z_virtual_endstop, el z_offset de la sonda la reemplaza)
# No se puede tener las dos cosas a la vez en el printer.cfg activo (mismo
# pin PA11, Klipper rechaza pines duplicados) - por eso este archivo está
# separado y no se incluye todavía.

[safe_z_home]
home_xy_position: 115, 115   # centro de la cama 230x230 - válido también con sonda
speed: 80.0
z_hop: 10.0
z_hop_speed: 10.0

[bed_mesh]
speed: 100
horizontal_move_z: 8
# [PENDIENTE DE AJUSTAR] mesh_min/mesh_max deben estar en coordenadas de la
# BOQUILLA, pero deben quedar dentro del área donde la SONDA también pueda
# llegar sin salirse de la cama (Klipper resta el x_offset/y_offset
# internamente). Con offset 0,0 (sonda centrada en la boquilla, poco
# realista) estos valores servirían; con un offset real hay que achicar el
# rango del lado correspondiente. Medir después de montar la sonda.
mesh_min: 10, 10
mesh_max: 210, 210
probe_count: 5, 5
fade_start: 1.0
fade_end: 10

[screws_tilt_adjust]
# Mismas coordenadas que ya usamos para la nivelación manual (NIVELAR_*) -
# son la posición real de los 4 tornillos de esta cama, no un ejemplo.
screw1: 30, 30
screw1_name: front left screw
screw2: 200, 30
screw2_name: front right screw
screw3: 200, 200
screw3_name: rear right screw
screw4: 30, 200
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50

# ============================================================================
# PROCEDIMIENTO DE PUESTA EN MARCHA (cuando la sonda esté instalada):
# 1. Desconectar físicamente el switch mecánico de Z del conector PA11.
# 2. Conectar la sonda nueva en su lugar.
# 3. En printer.cfg: comentar/quitar el endstop_pin: ^!PA11 y
#    position_endstop: 0 de [stepper_z], agregar endstop_pin:
#    probe:z_virtual_endstop.
# 4. Agregar "[include probe-future.cfg]" cerca del principio de printer.cfg.
# 5. Comentar/quitar las secciones [bed_mesh] y [screws_tilt_adjust] del
#    printer.cfg activo (quedarían duplicadas con las de este archivo).
# 6. Reiniciar Klipper, confirmar que carga sin error (RESTART).
# 7. BLTOUCH_DEBUG COMMAND=pin_down / pin_up para confirmar que el
#    mecanismo responde (sin calor, sin mover Z) - mismo procedimiento que
#    se usó para diagnosticar el clon roto, documentado en BITACORA.md.
# 8. Con el cabezal lejos de la cama y alguien presente: PROBE_CALIBRATE
#    para medir z_offset (procedimiento oficial, con TESTZ/ACCEPT).
# 9. Medir x_offset/y_offset físicamente (regla, o el método de papel
#    comparando la posición de disparo de la sonda contra la de la
#    boquilla).
# 10. Ajustar mesh_min/mesh_max de [bed_mesh] según el offset medido.
# 11. BED_MESH_CALIBRATE, revisar el resultado antes de confiar en él para
#     imprimir.
# ============================================================================
