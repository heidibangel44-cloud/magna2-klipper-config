# ============================================================================
# CONFIGURACIÓN FUTURA DE INPUT SHAPER / ACELERÓMETRO - NO ACTIVA
# ============================================================================
# Este archivo NO se carga todavía. printer.cfg no lo incluye a propósito -
# referenciar un MCU que no existe haría que Klipper fallara al conectar.
#
# Investigado 2026-10-25 (ver BITACORA.md para fuentes completas):
#
# - Acelerómetro recomendado: ADXL345 (el más probado por la comunidad de
#   los soportados oficialmente por Klipper - también existen MPU-9250,
#   ICM20948, LIS2DW, LIS3DH, BMI160).
# - MCU adicional recomendado: Raspberry Pi Pico (NO ESP32 - investigado y
#   descartado, Klipper no lo soporta oficialmente, solo hay forks
#   experimentales marcados como "no aptos para producción" por sus propios
#   autores). El Pico es la opción oficial, barata (~4-5 USD) y madura.
# - Costo orientativo total (fuente comunitaria, no precio de tienda local):
#   breakout ADXL345 ~3-8 USD + Pico ~4-5 USD.
# - El cálculo pesado (FFT) corre en el HOST (esta netbook), no en el Pico -
#   instalar numpy/scipy puede tardar 10-20 minutos en este hardware débil,
#   según la propia doc oficial. Planificar tiempo para eso.
#
# NO INVENTAR frecuencias de resonancia (shaper_freq_x/y) ni tipo de shaper -
# se miden recién cuando el acelerómetro físico esté instalado, con
# SHAPER_CALIBRATE. Copiar valores de otra impresora (incluso del mismo
# modelo) NO es válido - dependen de la masa y rigidez real de ESTA unidad.
# ============================================================================

# [mcu pico]
# El puerto serie del Pico se confirma con "ls /dev/serial/by-id/" una vez
# conectado por USB - va a aparecer como un dispositivo nuevo, DISTINTO del
# "usb-1a86..." que ya usa la Robin Nano. No asumir el nombre, verificarlo.
#serial: /dev/serial/by-id/usb-Klipper_rp2040_XXXXXXXX-if00

#[adxl345]
# Conexión por SPI al Pico - pines exactos según cómo se cablee el breakout
# del ADXL345 al Pico (no inventar, documentar según el cableado real
# cuando se haga). Ejemplo típico de la doc oficial (verificar, no copiar
# a ciegas):
#cs_pin: pico:gpio1
#spi_software_sclk_pin: pico:gpio2
#spi_software_mosi_pin: pico:gpio3
#spi_software_miso_pin: pico:gpio0

#[resonance_tester]
# Punto de medición: cerca del centro de la cama en X/Y, altura razonable
# sobre la cama (no tocar nada). Ajustar a la geometría real una vez que el
# acelerómetro esté montado en el carro X.
#probe_points: 115, 115, 20
#accel_chip: adxl345

# ============================================================================
# PROCEDIMIENTO DE PUESTA EN MARCHA (cuando se consiga el hardware):
# 1. Montar el ADXL345 en el carro X (con cinta doble faz rígida o un
#    soporte impreso - debe quedar firme, sin juego, o la medición sale mal).
# 2. Conectar el Pico por USB a la netbook, flashearlo con el firmware de
#    Klipper compilado para RP2040 (toolchain make menuconfig -> Pico).
# 3. Confirmar el puerto serie nuevo con "ls /dev/serial/by-id/".
# 4. Completar los pines reales de conexión SPI del ADXL345 al Pico arriba.
# 5. Agregar "[include input-shaper-future.cfg]" a printer.cfg.
# 6. Reiniciar Klipper, confirmar que conecta a AMBOS MCUs sin error.
# 7. MEASURE_AXES_NOISE - confirma que el acelerómetro responde antes de
#    medir resonancias reales.
# 8. Con el eje X homeado y el cabezal en una posición segura: SHAPER_CALIBRATE
#    AXIS=X, después mover el acelerómetro a la cama (bed-slinger - esta
#    impresora mueve la cama en Y, no el cabezal) y SHAPER_CALIBRATE AXIS=Y.
# 9. Klipper genera gráficos y un shaper/frecuencia recomendados - agregar
#    esos valores medidos (no inventados) a una sección [input_shaper] real
#    en printer.cfg.
# 10. Ajustar max_accel en [printer] según lo que sugiera el resultado
#     medido - no subirlo a ciegas antes de tener el dato real.
# 11. Imprimir una pieza de prueba con paredes verticales lisas, comparar
#     antes/después del Input Shaper (buscar que el "ringing"/ondulado
#     visible en esquinas se reduzca).
# ============================================================================
