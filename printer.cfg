####################################################################
# printer.cfg - Hellbot Magna 2 230 Dual (2 en 1) - MKS Robin Nano V1.3
####################################################################
#
# Construido a partir de:
#  1) Pines oficiales de Klipper para MKS Robin Nano V1.2/V1.3
#     https://github.com/Klipper3d/klipper/blob/master/config/generic-mks-robin-nano-v1.cfg
#     (Makerbase confirma que V1.2, V1.3 y Nano-S V1.3 comparten el mismo
#     pinout físico: https://github.com/makerbase-mks/Klipper-for-MKS-Boards)
#  2) Configuración real, probada por la comunidad, para el Wanhao D12/230
#     DUAL (mismo mecanismo "2 motores -> 1 hotend") sobre MKS Robin Nano
#     V1.3 con BLTouch, publicada por Yumi-Lab:
#     https://github.com/Yumi-Lab/yumi-config/tree/main/smartpad-wanhao-D12230-DUAL-MKS1.3-2TMC-3A4988-BL
#
# Marcado en los comentarios:
#   [VERIFICADO]  = confirmado por documentación oficial o config probada
#   [REVISAR]     = depende de tu unidad física, hay que medirlo/probarlo
#
# Ver referencia completa de parámetros: https://www.klipper3d.org/Config_Reference.html

[mcu]
# [REVISAR] Ajustar el puerto serie real. Con el host conectado por USB,
# confirmar con: ls /dev/serial/by-id/   (preferible a /dev/ttyUSB0 porque
# no cambia si se reconecta el cable)
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 2500
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 5.0

####################################################################
# Motores - pines [VERIFICADO] (idénticos en V1.2, V1.3 y Nano-S V1.3)
####################################################################

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: !PA15
position_endstop: 0
position_min: 0
position_max: 230          # [REVISAR] recorrido real de X (spec: 230 mm)
homing_speed: 50

[stepper_y]
step_pin: PE0
dir_pin: !PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: !PA12
position_endstop: 0
position_min: 0
position_max: 230          # [REVISAR] recorrido real de Y (spec: 230 mm)
homing_speed: 50

[stepper_z]
step_pin: PB5
dir_pin: !PB4              # A4988 en Z (Hellbot Magna 2: TMC2209 solo en X/Y)
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
# [TEMPORAL] El "3D Touch" no completa correctamente el modo touch_mode
# que necesita Klipper (probado y documentado el 2026-08-11) - usando el
# switch mecánico de Z como endstop hasta resolver/reemplazar el sensor.
#endstop_pin: probe:z_virtual_endstop
endstop_pin: !PA11
position_endstop: 0       # [REVISAR] calibrar con el procedimiento de Z offset
position_min: -2
position_max: 250          # [REVISAR] altura real (spec: 250 mm)

####################################################################
# Extrusor T0 - pines [VERIFICADO]
####################################################################

[extruder]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
microsteps: 16
# rotation_distance medido físicamente el 2026-08-11 (T0), 2 pasadas:
# 1) 100mm pedidos -> 23mm reales. nuevo = 33.500*(23/100) = 7.705
# 2) verificación con 7.705: 100mm pedidos -> 97mm reales (3% de margen
#    de medición manual). Afinado: 7.705*(97/100) = 7.474
rotation_distance: 7.474
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC3
sensor_type: ATC Semitec 104GT-2   # [REVISAR] confirmar tipo real de termistor
sensor_pin: PC1
#control: pid
# [REVISAR] valores PID de ejemplo (típicos de este board). Recalibrar con
# el macro PID_EXTRUDER incluido más abajo.
#pid_Kp: 14.669
#pid_Ki: 0.572
#pid_Kd: 94.068
min_temp: 0
max_temp: 250
max_extrude_only_velocity: 60
max_extrude_only_distance: 500
max_extrude_cross_section: 100

####################################################################
# Extrusor T1 - segundo motor que alimenta el MISMO hotend (2 en 1)
# [VERIFICADO] Pines PA6/PA1/PA3 coinciden tanto en el ejemplo oficial de
# Klipper (extruder1 comentado en generic-mks-robin-nano-v1.cfg) como en
# la config real probada del Wanhao D12/230 Dual.
#
# Se usa "extruder_stepper" (forma moderna, NO deprecada) en lugar de
# "shared_heater": T1 no tiene heater ni sensor propios porque comparte
# el MISMO bloque calefactor y termistor que T0 (un solo hotend físico).
####################################################################

[extruder_stepper extruder1]
extruder:
step_pin: PA6
dir_pin: !PA1
enable_pin: !PA3
full_steps_per_rotation: 200
microsteps: 16
# rotation_distance medido físicamente el 2026-08-11 (T1, distinto a T0):
# con 7.474 (copiado de T0): 100mm pedidos -> 105mm reales.
# ajustado = 7.474*(105/100) = 7.848
rotation_distance: 7.848

# Los siguientes macros T0/T1 activan un motor u otro (nunca los dos a la
# vez, salvo que quieras mezclar). Cambiar de herramienta con T0 o T1 en
# el gcode / slicer.
# [REVISAR] distancia de retracción/carga en cambio de herramienta: 80mm,
# según indicó el usuario (distancia real hasta el punto donde se juntan
# los dos caminos de filamento en el hotend 2-en-1). Ajustar si al probar
# un cambio de color real se ve mezcla de colores (aumentar) o que tarda
# de más / gotea (disminuir). Velocidades conservadoras para no romper
# la punta del filamento al retraer en caliente (25mm/s retracción,
# 20mm/s carga).

[gcode_macro T0]
gcode:
    {% if printer.toolhead.extruder == "extruder1" %}
        {% if printer.extruder.can_extrude|lower != 'true' %}
            {action_raise_error("Hotend no está a temperatura de extrusión, no se puede cambiar de herramienta")}
        {% endif %}
        SAVE_GCODE_STATE NAME=toolchange_t0
        G92 E0
        G1 E-80 F1500
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
        G92 E0
        G1 E80 F1200
        G92 E0
        RESTORE_GCODE_STATE NAME=toolchange_t0
    {% endif %}
    RESPOND MSG="Extrusor T0 activo"

[gcode_macro T1]
gcode:
    {% if printer.toolhead.extruder == "extruder" %}
        {% if printer.extruder.can_extrude|lower != 'true' %}
            {action_raise_error("Hotend no está a temperatura de extrusión, no se puede cambiar de herramienta")}
        {% endif %}
        SAVE_GCODE_STATE NAME=toolchange_t1
        G92 E0
        G1 E-80 F1500
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
        G92 E0
        G1 E80 F1200
        G92 E0
        RESTORE_GCODE_STATE NAME=toolchange_t1
    {% endif %}
    RESPOND MSG="Extrusor T1 activo"

####################################################################
# Cama caliente - pines [VERIFICADO]
####################################################################

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F   # [REVISAR] confirmar tipo real
sensor_pin: PC0
#control: pid
#pid_Kp: 325.10
#pid_Ki: 63.35
#pid_Kd: 417.10
min_temp: 0
max_temp: 100               # [REVISAR] cama magnética flexible: no pasar de lo recomendado por Hellbot

####################################################################
# Sensores de corte de filamento - 2 unidades (uno por extrusor)
# Pines PA4/PE6 según código fuente oficial de Marlin para esta placa
# (pins_MKS_ROBIN_NANO_common.h: FIL_RUNOUT_PIN/FIL_RUNOUT2_PIN).
# [REVISAR] confirmar con una prueba real (sacar el filamento y ver si
# dispara la alarma) antes de imprimir. Manual Hellbot: si ambos están
# conectados, ambos necesitan filamento cargado aunque uses solo uno.
####################################################################

[filament_switch_sensor sensor_t0]
switch_pin: ^PA4
pause_on_runout: True
runout_gcode:
    RESPOND MSG="T0 sin filamento"
insert_gcode:
    RESPOND MSG="T0 filamento detectado"

[filament_switch_sensor sensor_t1]
switch_pin: ^PE6
pause_on_runout: True
runout_gcode:
    RESPOND MSG="T1 sin filamento"
insert_gcode:
    RESPOND MSG="T1 filamento detectado"

####################################################################
# Ventilador de piezas - pin [VERIFICADO]
# (el ventilador del hotend, si existe, suele ir cableado directo a 24V
# sin pasar por la placa: no requiere entrada en Klipper)
####################################################################

[fan]
pin: PB1

####################################################################
# BLTouch - conector dedicado de 5 pines de la Robin Nano V1.3
# [VERIFICADO] pines PA11 (señal) / PA8 (control) según config real
# probada del Wanhao D12/230 Dual con BLTouch sobre este mismo board.
####################################################################

# [DESACTIVADO 2026-08-11] El "3D Touch" no completa el modo touch_mode
# correctamente (QUERY_PROBE queda en TRIGGERED sin importar la posición
# real del pin, incluso siguiendo el procedimiento oficial de Klipper
# paso a paso: https://www.klipper3d.org/BLTouch.html#initial-tests).
# El despliegue/repliegue básico y la señal cruda del pin SÍ funcionan
# bien (confirmado con pruebas directas) - el problema está específico
# en la detección fina de contacto. Puede ser daño puntual o limitación
# de este clon. Pendiente: reemplazar o investigar más, después retomar
# bed_mesh/screws_tilt_adjust automáticos.
#[bltouch]
#sensor_pin: ^PA11
#control_pin: PA8
# [REVISAR] estos offsets son de la posición física de la sonda respecto
# a la boquilla. Son ESPECÍFICOS de cómo esté montada la sonda en TU
# impresora: hay que medirlos a mano (no se pueden reutilizar de otra
# máquina, ni siquiera del D12 con el mismo mecanismo). Poner 0,0,0 y usar
# el procedimiento oficial de calibración de offset antes de imprimir:
# https://www.klipper3d.org/BLTouch.html#calibrating-your-bltouch
#x_offset: 0
#y_offset: 0
#z_offset: 0
#pin_move_time: 0.4
#speed: 5
#samples: 2
#sample_retract_dist: 3.0
#samples_result: median
#samples_tolerance: 0.050
#samples_tolerance_retries: 20
#pin_up_reports_not_triggered: True
#pin_up_touch_mode_reports_triggered: False

[safe_z_home]
home_xy_position: 115, 115   # [REVISAR] ajustar al centro real de la cama
speed: 80.0
z_hop: 10.0
z_hop_speed: 10.0

[bed_mesh]
speed: 100
horizontal_move_z: 8
mesh_min: 10, 10
mesh_max: 210, 210          # [REVISAR] ajustar a la zona real alcanzable por la sonda
probe_count: 5, 5
fade_start: 1.0
fade_end: 10

[screws_tilt_adjust]
# [REVISAR] coordenadas de ejemplo para una cama de 230x230 con tornillos
# en las 4 esquinas; ajustar a la posición real de los tornillos.
screw1: 30, 30
screw1_name: front left screw
screw2: 200, 30
screw2_name: front right screw
screw3: 200, 200
screw3_name: rear right screw
screw4: 30, 200
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50

####################################################################
# Drivers de motor - TMC2209 (X/Y) + A4988 (Z/E0/E1)
#
# La config real probada del D12/230 Dual (misma placa, mismo esquema de
# drivers "2 TMC2209 + 3 A4988") NO usa control por UART: los TMC2209
# funcionan en modo standalone (corriente fijada por el potenciómetro
# físico de la placa, microstepping por jumpers). Así es como está
# probado y funcionando; se deja así por defecto.
#
# [REVISAR / OPCIONAL] Si más adelante querés controlar corriente y
# microstepping por software (UART), los pines típicos reportados para
# este board son X=PA10, Y=PA9 (fuente: comunidad, confirmado en V1.1/V1.2;
# el pinout es igual en V1.3 pero no está verificado en una V1.3 real).
# Antes de habilitar esto, confirmá con un tester de continuidad que esos
# pines llegan al TMC2209 de tu unidad. Ejemplo de bloque a descomentar:
#
#[tmc2209 stepper_x]
#uart_pin: PA10
#run_current: 0.8
#stealthchop_threshold: 999999
#
#[tmc2209 stepper_y]
#uart_pin: PA9
#run_current: 0.8
#stealthchop_threshold: 999999

####################################################################
# Utilidades / macros básicos
####################################################################

[respond]
[display_status]
[pause_resume]
[exclude_object]

# Soporte de arcos G2/G3 - lo necesita OrcaSlicer en modo "Klipper"
# (con Marlin como flavor, no hace falta, Klipper los convierte igual,
# pero con flavor Klipper el slicer los emite nativos y esto es requerido)
[gcode_arcs]
resolution: 0.1

[virtual_sdcard]
path: ~/printer_data/gcodes

####################################################################
# PRINT_START / PRINT_END - llamar desde el slicer (G-code inicial:
# "PRINT_START EXTRUDER_TEMP=[nozzle_temperature] BED_TEMP=[bed_temperature]"
# G-code final: "PRINT_END"). Reemplaza mandar M104/M140/G28 sueltos
# desde el slicer.
# [REVISAR] la posición de la línea de purga (X5-5.4, Y20-150) es un
# valor de ejemplo dentro del área de cama (230x230) - confirmar que no
# se cruce con dónde el slicer ubica la pieza real.
####################################################################

[gcode_macro PRINT_START]
description: Rutina de inicio de impresión, llamar desde el slicer
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M140 S{BED_TEMP}
    M104 S150
    G28
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    G90
    G1 Z5 F600
    G1 X5 Y20 F3000
    G1 Z0.3 F300
    G92 E0
    G1 Y150 E15 F1000
    G1 X5.4 F5000
    G92 E0
    G1 Y20 E15 F1000
    G92 E0
    G1 Z2 F600

[gcode_macro PRINT_END]
description: Rutina de fin de impresión, llamar desde el slicer
gcode:
    M400
    TURN_OFF_HEATERS
    M107
    G91
    G1 Z10 F600
    G90
    G1 X10 Y220 F6000
    M84

[gcode_macro PAUSE]
description: Pausa la impresión actual
rename_existing: PAUSE_BASE
variable_extrude: 1.0
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
    {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-{E} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 Z{z_safe} F900
        G90
        G1 X{x_park} Y{y_park} F6000
    {% else %}
        {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro RESUME]
description: Reanuda la impresión pausada
rename_existing: RESUME_BASE
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91
        G1 E{E} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
description: Cancela la impresión actual
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    G91
    M107
    G1 Z2 F3000
    G90
    M84

[gcode_macro PID_EXTRUDER]
description: Calibra el PID del hotend (recomendado tras el primer flasheo)
gcode:
    M106 S255
    PID_CALIBRATE HEATER=extruder TARGET=210
    M107
    SAVE_CONFIG

[gcode_macro PID_BED]
description: Calibra el PID de la cama
gcode:
    PID_CALIBRATE HEATER=heater_bed TARGET=60
    SAVE_CONFIG

####################################################################
# Pantalla táctil de fábrica (3.5")
#
# [REVISAR - LIMITACIÓN CONOCIDA] Con firmware Marlin de fábrica, la
# pantalla táctil MKS TFT35 habla el protocolo serie de Marlin, que
# Klipper NO reproduce. Al pasar a Klipper la pantalla deja de dar touch
# UI completo; como mucho actúa como display pasivo en "modo 12864"
# (equivalente a una LCD de caracteres), sin navegación táctil de
# archivos ni control completo.
#
# Para recuperar una pantalla táctil funcional con Klipper hay dos
# caminos, ninguno automático:
#  1) Flashear en la propia pantalla (NO en la Robin Nano) el firmware
#     "modo Klipper" que publica Makerbase para las TFT24/28/32/35/43,
#     que la hace conectarse por WiFi directamente a Moonraker.
#  2) Usar KlipperScreen (software) en el propio host (el celular Android,
#     una Raspberry Pi, etc.) con una pantalla HDMI, en vez de la TFT35
#     original.
# Si querés, en el siguiente paso investigo la versión exacta de firmware
# "Klipper mode" para tu modelo de pantalla.
#
#[display]
#lcd_type: st7920
#cs_pin: PB1
#sclk_pin: PB0
#sid_pin: PC13
#encoder_pins: ^PB15, ^PB14
#click_pin: ^!PB13

#*# <---------------------- SAVE_CONFIG ---------------------->
#*# DO NOT EDIT THIS BLOCK OR BELOW. The contents are auto-generated.
#*#
#*# [extruder]
#*# control = pid
#*# pid_kp = 24.563
#*# pid_ki = 0.963
#*# pid_kd = 156.589
#*#
#*# [heater_bed]
#*# control = pid
#*# pid_kp = 65.585
#*# pid_ki = 0.951
#*# pid_kd = 1131.340
