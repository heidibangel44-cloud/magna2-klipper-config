####################################################################
# printer.cfg - Hellbot Magna 2 230 Dual (2 en 1) - MKS Robin Nano V1.3
####################################################################
#
# Construido a partir de:
#  1) Pines oficiales de Klipper para MKS Robin Nano V1.2/V1.3
#     https://github.com/Klipper3d/klipper/blob/master/config/generic-mks-robin-nano-v1.cfg
#     (Makerbase confirma que V1.2, V1.3 y Nano-S V1.3 comparten el mismo
#     pinout físico: https://github.com/makerbase-mks/Klipper-for-MKS-Boards)
#  2) Configuración real, probada por la comunidad, para el Wanhao D12/230
#     DUAL (mismo mecanismo "2 motores -> 1 hotend") sobre MKS Robin Nano
#     V1.3 con BLTouch, publicada por Yumi-Lab:
#     https://github.com/Yumi-Lab/yumi-config/tree/main/smartpad-wanhao-D12230-DUAL-MKS1.3-2TMC-3A4988-BL
#
# Marcado en los comentarios:
#   [VERIFICADO]  = confirmado por documentación oficial o config probada
#   [REVISAR]     = depende de tu unidad física, hay que medirlo/probarlo
#
# Ver referencia completa de parámetros: https://www.klipper3d.org/Config_Reference.html

[mcu]
# [REVISAR] Ajustar el puerto serie real. Con el host conectado por USB,
# confirmar con: ls /dev/serial/by-id/   (preferible a /dev/ttyUSB0 porque
# no cambia si se reconecta el cable)
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 2500
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 5.0

####################################################################
# Motores - pines [VERIFICADO] (idénticos en V1.2, V1.3 y Nano-S V1.3)
####################################################################

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: !PA15
position_endstop: 0
position_min: 0
position_max: 230          # [REVISAR] recorrido real de X (spec: 230 mm)
homing_speed: 50

[stepper_y]
step_pin: PE0
dir_pin: !PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: !PA12
position_endstop: 0
position_min: 0
position_max: 230          # [REVISAR] recorrido real de Y (spec: 230 mm)
homing_speed: 50

[stepper_z]
step_pin: PB5
dir_pin: !PB4              # A4988 en Z (Hellbot Magna 2: TMC2209 solo en X/Y)
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
# [CONCLUSIÓN 2026-08-18] Sonda "3D Touch" tiene falla real de hardware en
# el circuito del sensor (queda TRIGGERED fijo sin importar el estado del
# pin, confirmado con la sonda sola, switch sano probado en el mismo pin,
# reset probado). Volviendo definitivamente al switch mecánico + pull-up
# (^) hasta que se repare/reemplace la sonda.
#endstop_pin: probe:z_virtual_endstop
endstop_pin: ^!PA11
position_endstop: 0       # [REVISAR] recalibrar offset con procedimiento de papel
position_min: -2
position_max: 250          # [REVISAR] altura real (spec: 250 mm)
# [CONCLUSIÓN 2026-08-18] Se probó homing de una sola pasada (sin
# retroceso) sospechando backlash - no se pudo confirmar que ayudara,
# y la doc oficial de Klipper explica que la segunda pasada lenta EXISTE
# justamente para compensar el sobre-recorrido del switch a velocidad
# alta (mejora precisión, no la empeora). Con la causa real ya
# identificada (USB inestable + pull-up faltante, ambos corregidos),
# se vuelve al comportamiento estándar de 2 pasadas.
homing_speed: 5
#homing_retract_dist sin declarar = default de Klipper (5mm, 2 pasadas)

####################################################################
# Extrusor T0 - pines [VERIFICADO]
####################################################################

[extruder]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
microsteps: 16
# [RECALIBRADO 2026-10-26, procedimiento con M400 para confirmar movimiento
# real, no solo la posición lógica] 100mm pedidos -> 102mm reales con el
# valor anterior (7.474, de 2026-08-11) -> factor 1.02 -> nuevo = 7.474*1.02
# = 7.623. Verificación con 7.623: 100mm pedidos -> 100mm reales exactos
# (0% de error). Histórico: calibración de 2026-08-11 quedó documentada
# en BITACORA.md por si hace falta volver atrás.
rotation_distance: 7.623
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC3
sensor_type: ATC Semitec 104GT-2   # [REVISAR] confirmar tipo real de termistor
sensor_pin: PC1
#control: pid
# [REVISAR] valores PID de ejemplo (típicos de este board). Recalibrar con
# el macro PID_EXTRUDER incluido más abajo.
#pid_Kp: 14.669
#pid_Ki: 0.572
#pid_Kd: 94.068
min_temp: 0
max_temp: 250
max_extrude_only_velocity: 60
max_extrude_only_distance: 500
max_extrude_cross_section: 100

####################################################################
# Extrusor T1 - segundo motor que alimenta el MISMO hotend (2 en 1)
# [VERIFICADO] Pines PA6/PA1/PA3 coinciden tanto en el ejemplo oficial de
# Klipper (extruder1 comentado en generic-mks-robin-nano-v1.cfg) como en
# la config real probada del Wanhao D12/230 Dual.
#
# Se usa "extruder_stepper" (forma moderna, NO deprecada) en lugar de
# "shared_heater": T1 no tiene heater ni sensor propios porque comparte
# el MISMO bloque calefactor y termistor que T0 (un solo hotend físico).
####################################################################

[extruder_stepper extruder1]
extruder:
step_pin: PA6
dir_pin: !PA1
enable_pin: !PA3
full_steps_per_rotation: 200
microsteps: 16
# rotation_distance medido físicamente el 2026-08-11 (T1, distinto a T0):
# con 7.474 (copiado de T0): 100mm pedidos -> 105mm reales.
# ajustado = 7.474*(105/100) = 7.848
rotation_distance: 7.848

# Los siguientes macros T0/T1 activan un motor u otro (nunca los dos a la
# vez, salvo que quieras mezclar). Cambiar de herramienta con T0 o T1 en
# el gcode / slicer.
# [REVISAR] distancia de retracción/carga en cambio de herramienta: 80mm,
# según indicó el usuario (distancia real hasta el punto donde se juntan
# los dos caminos de filamento en el hotend 2-en-1). Ajustar si al probar
# un cambio de color real se ve mezcla de colores (aumentar) o que tarda
# de más / gotea (disminuir). Velocidades conservadoras para no romper
# la punta del filamento al retraer en caliente (25mm/s retracción,
# 20mm/s carga).

# [PREPARADO 2026-10-25 - NO conectado todavía a T0/T1] _FORM_TIP: moldea
# la punta del filamento (ramming + enfriamiento con pequeños vaivenes)
# ANTES de retraer del todo, para que la punta quede fina y no se atasque
# en el splitter en Y donde se juntan los dos caminos de filamento - falla
# mecánica real y documentada de este diseño "2 motores -> 1 hotend".
# Adaptado (no copiado a ciegas) de una config real para esta MISMA
# impresora (Hellbot Magna 2, misma placa, mismos pines de extruder1):
# https://github.com/FacuM/hellbot-wanhao-300-dual-klipper
# Para usarla: llamar _FORM_TIP en vez de "G1 E-80 F1500" dentro de T0/T1.
# NO se conecta automáticamente todavía - falta probarla con el hotend
# caliente de verdad (requiere supervisión, no se puede validar en frío).
# [ALERTA 2026-10-25] El `distance` de abajo (80mm) es el mismo número que
# ya usábamos en T0/T1 para el retract rápido entre torres - PERO en el
# repo de referencia (misma arquitectura, otro hotend/splitter) probaron
# en la práctica que 80-90mm de retracción total dejaba un hilo colgando
# que atascaba el splitter en Y, y tuvieron que subir a ~150mm. La
# distancia correcta depende de la geometría exacta de NUESTRO splitter,
# no es necesariamente la misma que la de ellos ni que nuestro 80mm actual
# (que se verificó para el swap rápido, no para un ciclo completo de
# forming+park prolongado). NO asumir que 80 alcanza - probar con cuidado,
# revisando si queda filamento/hilo colgando, antes de confiar en este
# valor o de conectar este macro a T0/T1.
[gcode_macro _FORM_TIP]
variable_ram_mm: 2.0
variable_ram_speed: 15
variable_fast_mm: 12.0
variable_fast_speed: 45
variable_cooling_moves: 4
variable_cooling_mm: 4.0
variable_cooling_speed_start: 2.5
variable_cooling_speed_end: 4.0
variable_dwell_ms: 500
variable_distance: 80.0
variable_park_speed: 25
gcode:
    {% set cfg = printer["gcode_macro _FORM_TIP"] %}
    {% set ram = cfg.ram_mm|float %}
    {% set ram_f = cfg.ram_speed|float * 60 %}
    {% set fast = cfg.fast_mm|float %}
    {% set fast_f = cfg.fast_speed|float * 60 %}
    {% set moves = cfg.cooling_moves|int %}
    {% set cool = cfg.cooling_mm|float %}
    {% set v0 = cfg.cooling_speed_start|float %}
    {% set v1 = cfg.cooling_speed_end|float %}
    {% set dwell = cfg.dwell_ms|int %}
    {% set total = cfg.distance|float %}
    {% set park_f = cfg.park_speed|float * 60 %}
    {% set park = total + ram - fast %}
    {% if printer[printer.toolhead.extruder].can_extrude|lower != 'true' %}
        {action_raise_error("_FORM_TIP: hotend no está a temperatura de extrusión")}
    {% else %}
        {% if ram > 0 %}
            G1 E{ram} F{ram_f}
        {% endif %}
        G1 E-{fast} F{fast_f}
        {% for i in range(moves) %}
            {% set f = (v0 + (v1 - v0) * (i / ([moves - 1, 1]|max))) * 60 %}
            G1 E{cool} F{f}
            G1 E-{cool} F{f}
        {% endfor %}
        {% if dwell > 0 %}
            G4 P{dwell}
        {% endif %}
        {% if park > 0 %}
            G1 E-{park} F{park_f}
        {% endif %}
    {% endif %}

[gcode_macro T0]
gcode:
    {% if printer.toolhead.extruder == "extruder1" %}
        {% if printer.extruder.can_extrude|lower != 'true' %}
            {action_raise_error("Hotend no está a temperatura de extrusión, no se puede cambiar de herramienta")}
        {% endif %}
        SAVE_GCODE_STATE NAME=toolchange_t0
        G92 E0
        G1 E-80 F1500
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
        G92 E0
        G1 E80 F1200
        G92 E0
        RESTORE_GCODE_STATE NAME=toolchange_t0
    {% endif %}
    RESPOND MSG="Extrusor T0 activo"

[gcode_macro T1]
gcode:
    {% if printer.toolhead.extruder == "extruder" %}
        {% if printer.extruder.can_extrude|lower != 'true' %}
            {action_raise_error("Hotend no está a temperatura de extrusión, no se puede cambiar de herramienta")}
        {% endif %}
        SAVE_GCODE_STATE NAME=toolchange_t1
        G92 E0
        G1 E-80 F1500
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
        G92 E0
        G1 E80 F1200
        G92 E0
        RESTORE_GCODE_STATE NAME=toolchange_t1
    {% endif %}
    RESPOND MSG="Extrusor T1 activo"

# [AGREGADO 2026-10-25] Carga/descarga de filamento, independientes de
# _FORM_TIP (todavía sin probar con calor real) - retracción/purga simple y
# directa, igual de simple que lo que ya usan T0/T1 para el swap. Requieren
# que el extrusor correspondiente ya esté activo (llamar T0 o T1 primero
# si hace falta) - no cambian de herramienta solos, para que sea obvio qué
# motor se está moviendo en cada momento.
[gcode_macro LOAD_FILAMENT_T0]
description: Purgar/cebar filamento con T0 activo (necesita T0 seleccionado y hotend caliente)
gcode:
    {% if printer.toolhead.extruder == "extruder1" %}
        {action_raise_error("T1 está activo, no T0. Cambiá primero con el macro T0.")}
    {% elif printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Hotend no está a temperatura de extrusión.")}
    {% else %}
        G92 E0
        G1 E50 F300
        G92 E0
        RESPOND MSG="Filamento T0 purgado (50mm)"
    {% endif %}

[gcode_macro UNLOAD_FILAMENT_T0]
description: Retraer filamento con T0 activo (necesita T0 seleccionado y hotend caliente)
gcode:
    {% if printer.toolhead.extruder == "extruder1" %}
        {action_raise_error("T1 está activo, no T0. Cambiá primero con el macro T0.")}
    {% elif printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Hotend no está a temperatura de extrusión.")}
    {% else %}
        G92 E0
        G1 E-50 F300
        G92 E0
        RESPOND MSG="Filamento T0 retraido (50mm)"
    {% endif %}

[gcode_macro LOAD_FILAMENT_T1]
description: Purgar/cebar filamento con T1 activo (necesita T1 seleccionado y hotend caliente)
gcode:
    {% if printer.toolhead.extruder == "extruder" %}
        {action_raise_error("T0 está activo, no T1. Cambiá primero con el macro T1.")}
    {% elif printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Hotend no está a temperatura de extrusión.")}
    {% else %}
        G92 E0
        G1 E50 F300
        G92 E0
        RESPOND MSG="Filamento T1 purgado (50mm)"
    {% endif %}

[gcode_macro UNLOAD_FILAMENT_T1]
description: Retraer filamento con T1 activo (necesita T1 seleccionado y hotend caliente)
gcode:
    {% if printer.toolhead.extruder == "extruder" %}
        {action_raise_error("T0 está activo, no T1. Cambiá primero con el macro T1.")}
    {% elif printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Hotend no está a temperatura de extrusión.")}
    {% else %}
        G92 E0
        G1 E-50 F300
        G92 E0
        RESPOND MSG="Filamento T1 retraido (50mm)"
    {% endif %}

# [AGREGADO 2026-10-25] Reporte de calibracion actual - solo lectura, sin
# mover ni calentar nada.
[gcode_macro ESTADO_CALIBRACION]
description: Mostrar el estado actual de PA, retraccion, rotation_distance e Input Shaper
gcode:
    RESPOND MSG="--- Estado de calibracion ---"
    RESPOND MSG="{"Pressure advance T0: %.3f" % printer.extruder.pressure_advance}"
    RESPOND MSG="{"Rotation distance T0: %.3f mm" % printer.configfile.settings.extruder.rotation_distance}"
    RESPOND MSG="{"Rotation distance T1: %.3f mm" % printer.configfile.settings["extruder_stepper extruder1"].rotation_distance}"
    {% if 'firmware_retraction' in printer %}
        RESPOND MSG="{"Firmware retraction: %.2f mm" % printer.configfile.settings.firmware_retraction.retract_length}"
    {% else %}
        RESPOND MSG="Firmware retraction: no configurado"
    {% endif %}
    {% if 'input_shaper' in printer %}
        RESPOND MSG="Input Shaper: configurado"
    {% else %}
        RESPOND MSG="Input Shaper: NO configurado (falta acelerometro - ver input-shaper-future.cfg)"
    {% endif %}
    {% if 'probe' not in printer %}
        RESPOND MSG="Sonda Z: NO disponible (ver probe-future.cfg)"
    {% endif %}

####################################################################
# Cama caliente - pines [VERIFICADO]
####################################################################

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F   # [REVISAR] confirmar tipo real
sensor_pin: PC0
#control: pid
#pid_Kp: 325.10
#pid_Ki: 63.35
#pid_Kd: 417.10
min_temp: 0
max_temp: 100               # [REVISAR] cama magnética flexible: no pasar de lo recomendado por Hellbot

####################################################################
# Sensores de corte de filamento - 2 unidades (uno por extrusor)
# Pines PA4/PE6 según código fuente oficial de Marlin para esta placa
# (pins_MKS_ROBIN_NANO_common.h: FIL_RUNOUT_PIN/FIL_RUNOUT2_PIN).
# [REVISAR] confirmar con una prueba real (sacar el filamento y ver si
# dispara la alarma) antes de imprimir. Manual Hellbot: si ambos están
# conectados, ambos necesitan filamento cargado aunque uses solo uno.
####################################################################

[filament_switch_sensor sensor_t0]
switch_pin: ^PA4
pause_on_runout: True
runout_gcode:
    RESPOND MSG="T0 sin filamento"
insert_gcode:
    RESPOND MSG="T0 filamento detectado"

[filament_switch_sensor sensor_t1]
switch_pin: ^PE6
pause_on_runout: True
runout_gcode:
    RESPOND MSG="T1 sin filamento"
insert_gcode:
    RESPOND MSG="T1 filamento detectado"

####################################################################
# Ventilador de piezas - pin [VERIFICADO]
# (el ventilador del hotend, si existe, suele ir cableado directo a 24V
# sin pasar por la placa: no requiere entrada en Klipper)
####################################################################

[fan]
pin: PB1

# [PREPARADO 2026-10-25 - NO activado] Segundo ventilador auxiliar. Fuente
# confirmada: Marlin oficial (pins_MKS_ROBIN_NANO_common.h) - PB0 queda
# libre como "FAN1" cuando hay 1 solo hotend (nuestro caso). OJO: ese pin
# sale físicamente al terminal a tornillo rotulado "HE1" (el del segundo
# heater, no un conector de 3 pines de ventilador) - antes de activar esto
# hay que verificar a mano: 1) que el jumper de voltaje de ese terminal
# esté en el voltaje real del ventilador que se vaya a conectar (12V o
# 24V, NUNCA conectar un ventilador de 5V ahí), 2) que no haya nada más
# usando ese terminal. No activar sin esa verificación física.
#[heater_fan auxiliar]
#pin: PB0

####################################################################
# BLTouch - conector dedicado de 5 pines de la Robin Nano V1.3
# [VERIFICADO] pines PA11 (señal) / PA8 (control) según config real
# probada del Wanhao D12/230 Dual con BLTouch sobre este mismo board.
####################################################################

# [REINTENTO 2026-08-18] Caso documentado en
# https://github.com/Klipper3d/klipper/issues/5080 : clones "3D Touch" no
# soportan touch_mode (QUERY_PROBE / BLTOUCH_DEBUG COMMAND=touch_mode
# siempre reportan mal, no es que esté roto). probe_with_touch_mode debe
# quedar False siempre.
# [FIX 2026-08-18] Primer intento real de G28 Z dio error real de log:
# "Failed to verify BLTouch probe is raised; retrying" -> "BLTouch failed
# to raise probe". Este clon en particular SÍ necesita
# pin_up_reports_not_triggered: False (al revés de lo que le funcionó a
# otro usuario en el issue - cada clon se comporta distinto, esto es
# evidencia real de ESTE clon, no una suposición).
#[bltouch]
#sensor_pin: ^PA11
#control_pin: PA8
# [REVISAR] offsets sin medir todavía - se miden con el procedimiento
# oficial una vez confirmado que la sonda dispare bien (pendiente de
# reparar/reemplazar - ver nota de conclusión en [stepper_z]):
# https://www.klipper3d.org/BLTouch.html#calibrating-your-bltouch
#x_offset: 0
#y_offset: 0
#z_offset: 0
#speed: 1
#lift_speed: 1
#sample_retract_dist: 2.0
#samples: 2
#samples_result: average
#samples_tolerance: 0.100
#samples_tolerance_retries: 0
#pin_up_reports_not_triggered: False
# probe_with_touch_mode NO declarado (debe quedar False)

[safe_z_home]
home_xy_position: 115, 115   # [VERIFICADO] centro exacto de una cama 230x230 (230/2=115)
speed: 80.0
z_hop: 10.0
z_hop_speed: 10.0

# [INACTIVO 2026-10-25] BED_MESH_CALIBRATE va a fallar ("Must have probe") -
# la sonda "3D Touch" tiene falla de hardware confirmada (ver BITACORA.md,
# 2026-08-18). Queda definido para cuando se repare/reemplace la sonda, no
# usar mientras tanto.
[bed_mesh]
speed: 100
horizontal_move_z: 8
mesh_min: 10, 10
mesh_max: 210, 210          # [REVISAR] ajustar a la zona real alcanzable por la sonda
probe_count: 5, 5
fade_start: 1.0
fade_end: 10

# [INACTIVO 2026-10-25] SCREWS_TILT_CALCULATE también depende de la sonda -
# mismo estado que [bed_mesh] arriba. La nivelación manual con los macros
# NIVELAR_ESQUINA_x sigue siendo el método real mientras tanto.
[screws_tilt_adjust]
# [REVISAR] coordenadas de ejemplo para una cama de 230x230 con tornillos
# en las 4 esquinas; ajustar a la posición real de los tornillos.
screw1: 30, 30
screw1_name: front left screw
screw2: 200, 30
screw2_name: front right screw
screw3: 200, 200
screw3_name: rear right screw
screw4: 30, 200
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50

# [AGREGADO 2026-10-25] Mensajes claros en español cuando falta la sonda,
# en vez del error críptico de Klipper ("Must have probe..."). La lógica
# de "avisar si falta hardware" vive en el macro, no en Mainsail - así
# funciona Klipper (investigado 2026-10-25).
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
description: Generar malla de nivelación automática (necesita sonda funcional)
gcode:
    {% if 'probe' not in printer %}
        {action_raise_error("No disponible: no hay sonda configurada. La sonda 3D Touch tiene una falla de hardware confirmada (BITACORA.md, 2026-08-18) y está desconectada. Hay que repararla o reemplazarla antes de usar esta función. Mientras tanto, usá los botones NIVELAR_ESQUINA_x para nivelar a mano.")}
    {% else %}
        BED_MESH_CALIBRATE_BASE {rawparams}
    {% endif %}

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: SCREWS_TILT_CALCULATE_BASE
description: Calcular ajuste de tornillos de la cama (necesita sonda funcional)
gcode:
    {% if 'probe' not in printer %}
        {action_raise_error("No disponible: no hay sonda configurada. La sonda 3D Touch tiene una falla de hardware confirmada (BITACORA.md, 2026-08-18) y está desconectada. Hay que repararla o reemplazarla antes de usar esta función. Mientras tanto, usá los botones NIVELAR_ESQUINA_x para nivelar a mano.")}
    {% else %}
        SCREWS_TILT_CALCULATE_BASE {rawparams}
    {% endif %}

####################################################################
# Drivers de motor - TMC2209 (X/Y) + A4988 (Z/E0/E1)
#
# La config real probada del D12/230 Dual (misma placa, mismo esquema de
# drivers "2 TMC2209 + 3 A4988") NO usa control por UART: los TMC2209
# funcionan en modo standalone (corriente fijada por el potenciómetro
# físico de la placa, microstepping por jumpers). Así es como está
# probado y funcionando; se deja así por defecto.
#
# [REVISAR / OPCIONAL] Si más adelante querés controlar corriente y
# microstepping por software (UART), los pines típicos reportados para
# este board son X=PA10, Y=PA9 (fuente: comunidad, confirmado en V1.1/V1.2;
# el pinout es igual en V1.3 pero no está verificado en una V1.3 real).
# Antes de habilitar esto, confirmá con un tester de continuidad que esos
# pines llegan al TMC2209 de tu unidad. Ejemplo de bloque a descomentar:
#
#[tmc2209 stepper_x]
#uart_pin: PA10
#run_current: 0.8
#stealthchop_threshold: 999999
#
#[tmc2209 stepper_y]
#uart_pin: PA9
#run_current: 0.8
#stealthchop_threshold: 999999

####################################################################
# Utilidades / macros básicos
####################################################################

[respond]
[display_status]
[pause_resume]
[exclude_object]

# Soporte de arcos G2/G3 - lo necesita OrcaSlicer en modo "Klipper"
# (con Marlin como flavor, no hace falta, Klipper los convierte igual,
# pero con flavor Klipper el slicer los emite nativos y esto es requerido)
[gcode_arcs]
resolution: 0.1

[virtual_sdcard]
path: ~/printer_data/gcodes

####################################################################
# Botones de nivelación manual para Mainsail. La temperatura NO se
# maneja acá a propósito (se elige aparte, manualmente) - esto solo
# mueve el cabezal. Cada botón sube a altura segura (Z10) antes de
# moverse en X/Y, y homea solo si hace falta.
####################################################################

[gcode_macro _NIVELAR_IR]
gcode:
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G1 Z10 F600
    G1 X{x} Y{y} F3000
    G1 Z1 F300

[gcode_macro NIVELAR]
description: Iniciar nivelación DE CERO - fuerza un home nuevo y va a la esquina 1
gcode:
    G28
    _NIVELAR_IR X=30 Y=30

[gcode_macro NIVELAR_ESQUINA_1]
description: Volver a la esquina 1 SIN rehomear (si ya está homeado)
gcode:
    _NIVELAR_IR X=30 Y=30

[gcode_macro NIVELAR_ESQUINA_2]
description: Ir a la esquina 2 (adelante-derecha)
gcode:
    _NIVELAR_IR X=200 Y=30

[gcode_macro NIVELAR_ESQUINA_3]
description: Ir a la esquina 3 (atrás-derecha)
gcode:
    _NIVELAR_IR X=200 Y=200

[gcode_macro NIVELAR_ESQUINA_4]
description: Ir a la esquina 4 (atrás-izquierda)
gcode:
    _NIVELAR_IR X=30 Y=200

[gcode_macro NIVELAR_CENTRO]
description: Ir al centro para verificar la nivelación
gcode:
    _NIVELAR_IR X=115 Y=115

[gcode_macro ALTURA_SEGURA]
description: Subir Z a una altura segura (10mm), homea si hace falta
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G1 Z10 F600

# [AGREGADO 2026-10-25] Prueba simple de ventilador - sin movimiento, sin
# calor. Sube a 3 velocidades y vuelve a apagar, para confirmar que
# responde antes de confiar en él durante una impresión.
[gcode_macro FAN_TEST]
description: Probar el ventilador de piezas en 3 velocidades (sin mover nada, sin calentar)
gcode:
    RESPOND MSG="Fan al 30%"
    M106 S76
    G4 P2000
    RESPOND MSG="Fan al 60%"
    M106 S153
    G4 P2000
    RESPOND MSG="Fan al 100%"
    M106 S255
    G4 P2000
    M107
    RESPOND MSG="Fan apagado - prueba terminada"

# [AGREGADO 2026-10-25] Reporte de estado de sensores de un vistazo -
# solo lectura, sin mover nada. Responde "pendiente" en vez de fallar si
# falta hardware (ej. sonda).
[gcode_macro DIAGNOSTICO_SENSORES]
description: Mostrar el estado actual de endstops, temperaturas y sensores de filamento
gcode:
    RESPOND MSG="--- Diagnostico de sensores ---"
    RESPOND MSG="{"Homed: %s" % (printer.toolhead.homed_axes if printer.toolhead.homed_axes else "ninguno")}"
    RESPOND MSG="{"Extrusor: %.1f C (objetivo %.1f)" % (printer.extruder.temperature, printer.extruder.target)}"
    RESPOND MSG="{"Cama: %.1f C (objetivo %.1f)" % (printer.heater_bed.temperature, printer.heater_bed.target)}"
    RESPOND MSG="{"Sensor filamento T0: %s" % ("filamento detectado" if printer["filament_switch_sensor sensor_t0"].filament_detected else "sin filamento")}"
    RESPOND MSG="{"Sensor filamento T1: %s" % ("filamento detectado" if printer["filament_switch_sensor sensor_t1"].filament_detected else "sin filamento")}"
    {% if 'probe' not in printer %}
        RESPOND MSG="Sonda Z: NO disponible (falla de hardware confirmada, desconectada)"
    {% endif %}
    QUERY_ENDSTOPS

# [AGREGADO 2026-10-26] Diagnostico de comunicacion con el MCU - para la
# inestabilidad de USB conocida de este proyecto. Solo lectura. OJO: si
# Klipper ya está en shutdown por pérdida de comunicación, este macro NO
# va a poder correr (ningún gcode corre durante un shutdown) - solo sirve
# para revisar el estado DESPUÉS de reconectar, no durante la caída.
[gcode_macro DIAGNOSTICO_USB]
description: Mostrar estadisticas de comunicacion con el MCU (retransmisiones, errores)
gcode:
    RESPOND MSG="--- Diagnostico de comunicacion MCU ---"
    RESPOND MSG="{"Bytes retransmitidos: %s" % printer.mcu.last_stats.bytes_retransmit}"
    RESPOND MSG="{"Bytes invalidos: %s" % printer.mcu.last_stats.bytes_invalid}"
    RESPOND MSG="{"MCU awake: %.3f" % printer.mcu.last_stats.mcu_awake}"
    RESPOND MSG="Si esto corrio, la comunicacion esta activa ahora. Para el historial completo de desconexiones, revisar tools/usb_monitor_pasivo*.csv en la netbook."

# Subido de 600s (10min) default a 900s (15min) - pedido explícito para
# tener más margen durante calibración manual sin que se apaguen solos
# los motores/heaters.
[idle_timeout]
timeout: 900

####################################################################
# Retracción por firmware (G10/G11) - evita depender de que el slicer
# calcule la retracción, Klipper la aplica directo en el firmware.
# [REVISAR] valores de partida conservadores para Bowden Dual Drive -
# falta calibrar con una torre de retracción real (imprimir y ajustar
# retract_length hasta que desaparezca el oozing/stringing sin que
# aparezcan "blobs" al reiniciar extrusión).
####################################################################

[firmware_retraction]
retract_length: 3
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 40

####################################################################
# PRINT_START / PRINT_END - llamar desde el slicer (G-code inicial:
# "PRINT_START EXTRUDER_TEMP=[nozzle_temperature] BED_TEMP=[bed_temperature]"
# G-code final: "PRINT_END"). Reemplaza mandar M104/M140/G28 sueltos
# desde el slicer.
# [REVISAR] la posición de la línea de purga (X5-5.4, Y20-150) es un
# valor de ejemplo dentro del área de cama (230x230) - confirmar que no
# se cruce con dónde el slicer ubica la pieza real.
####################################################################

[gcode_macro PRINT_START]
description: Rutina de inicio de impresión, llamar desde el slicer
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M140 S{BED_TEMP}
    M104 S150
    G28
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    G90
    G1 Z5 F600
    G1 X5 Y20 F3000
    G1 Z0.3 F300
    G92 E0
    G1 Y150 E15 F1000
    G1 X5.4 F5000
    G92 E0
    G1 Y20 E15 F1000
    G92 E0
    G1 Z2 F600

[gcode_macro PRINT_END]
description: Rutina de fin de impresión, llamar desde el slicer
gcode:
    M400
    TURN_OFF_HEATERS
    M107
    G91
    G1 Z10 F600
    G90
    G1 X10 Y220 F6000
    M84

[gcode_macro PAUSE]
description: Pausa la impresión actual
rename_existing: PAUSE_BASE
variable_extrude: 1.0
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
    {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-{E} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 Z{z_safe} F900
        G90
        G1 X{x_park} Y{y_park} F6000
    {% else %}
        {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro RESUME]
description: Reanuda la impresión pausada
rename_existing: RESUME_BASE
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91
        G1 E{E} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
description: Cancela la impresión actual
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    G91
    M107
    G1 Z2 F3000
    G90
    M84

[gcode_macro PID_EXTRUDER]
description: Calibra el PID del hotend (recomendado tras el primer flasheo)
gcode:
    M106 S255
    PID_CALIBRATE HEATER=extruder TARGET=210
    M107
    SAVE_CONFIG

[gcode_macro PID_BED]
description: Calibra el PID de la cama
gcode:
    PID_CALIBRATE HEATER=heater_bed TARGET=60
    SAVE_CONFIG

####################################################################
# Pantalla táctil de fábrica (3.5")
#
# [REVISAR - LIMITACIÓN CONOCIDA] Con firmware Marlin de fábrica, la
# pantalla táctil MKS TFT35 habla el protocolo serie de Marlin, que
# Klipper NO reproduce. Al pasar a Klipper la pantalla deja de dar touch
# UI completo; como mucho actúa como display pasivo en "modo 12864"
# (equivalente a una LCD de caracteres), sin navegación táctil de
# archivos ni control completo.
#
# Para recuperar una pantalla táctil funcional con Klipper hay dos
# caminos, ninguno automático:
#  1) Flashear en la propia pantalla (NO en la Robin Nano) el firmware
#     "modo Klipper" que publica Makerbase para las TFT24/28/32/35/43,
#     que la hace conectarse por WiFi directamente a Moonraker.
#  2) Usar KlipperScreen (software) en el propio host (el celular Android,
#     una Raspberry Pi, etc.) con una pantalla HDMI, en vez de la TFT35
#     original.
# Si querés, en el siguiente paso investigo la versión exacta de firmware
# "Klipper mode" para tu modelo de pantalla.
#
# [ERROR DE MANTENIMIENTO ENCONTRADO 2026-10-25] Este bloque de ejemplo
# usaba cs_pin: PB1 y sclk_pin: PB0, que YA están en uso: PB1 es el
# [fan] de piezas (activo) y PB0 es el [heater_fan auxiliar] preparado
# más arriba. Si algún día se recupera esta pantalla por este camino,
# estos pines específicos están MAL y van a chocar - habría que verificar
# los pines reales de ESE conector de LCD en el esquemático, no reusar
# este ejemplo tal cual. No se corrige porque, como dice arriba, esta vía
# no da touch UI completo de todas formas - las opciones recomendadas
# siguen siendo KlipperScreen o reflashear la TFT con firmware "modo
# Klipper".
#[display]
#lcd_type: st7920
#cs_pin: PB1
#sclk_pin: PB0
#sid_pin: PC13
#encoder_pins: ^PB15, ^PB14
#click_pin: ^!PB13

