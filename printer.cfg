####################################################################
# printer.cfg - Hellbot Magna 2 230 Dual - MKS Robin Nano V1.3
####################################################################
#
# [2026-11-02] Versión auditada línea por línea contra todas las fuentes
# reunidas en este proyecto:
#  - Nuestra config original (commit 8be9ee1, GitHub) y su historial completo.
#  - La base real de Yumi-Lab para esta misma impresora (Wanhao D12/230
#    Dual = mismo rebrand que la Hellbot Magna 2 230 Dual, pin por pin):
#    https://github.com/Yumi-Lab/yumi-config/tree/main/smartpad-wanhao-D12230-DUAL-MKS1.3-2TMC-3A498
#  - FacuM/hellbot-wanhao-300-dual-klipper (misma placa, cama de 300mm).
#  - El Marlin REAL de fábrica (DevelopmentHellbot/Magna-Dual,
#    Configuration.h, bloque "#if 1" que de verdad compila) - fuente de
#    los límites de velocidad/aceleración de abajo.
#  - El firmware (.bin) real instalado en la placa: confirmado más nuevo
#    que cualquier binario de referencia encontrado - no requiere reflasheo.
#
# Se mantienen SOLO los valores que son hechos medidos de ESTA unidad
# física (no transferibles de ninguna config ajena: calibración de
# extrusores, PID, offsets) y las herramientas de diagnóstico ya probadas.
#
# Confirmado hoy con prueba física real (QUERY_ENDSTOPS, switch TRIGGERED
# en el cero lógico de los 3 ejes, repetido y verificado a mano con el
# usuario): el homing de X, Y y Z es consistente - no hay pérdida de
# pasos ni "memoria" de Klipper fallando. Ver BITACORA.md para el detalle
# completo de esta investigación.
#
# Marcado en los comentarios:
#   [YUMI]        = viene de la base de Yumi-Lab, no tocado
#   [NUESTRO]     = valor medido/verificado en ESTA impresora, no se reemplaza
#   [MARLIN REAL] = tomado del Configuration.h que de verdad compila para esta máquina
#   [REVISAR]     = depende de tu unidad física, hay que medirlo/probarlo
#
# Ver referencia completa de parámetros: https://www.klipper3d.org/Config_Reference.html

[mcu]
# [NUESTRO] Puerto real por ID (no cambia si se reconecta el cable) -
# importante para la estabilidad de USB ya documentada en este proyecto.
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[virtual_sdcard]
path: ~/printer_data/gcodes

[exclude_object]
[respond]
[display_status]
[pause_resume]

# Soporte de arcos G2/G3 - lo necesita OrcaSlicer en modo "Klipper"
[gcode_arcs]
resolution: 0.1

[include mainsail.cfg]

[printer]
kinematics: cartesian
# [2026-11-02] [MARLIN REAL] El Marlin que de verdad compila para esta
# máquina (DevelopmentHellbot/Magna-Dual, Configuration.h) permite hasta
# 500mm/s en X/Y - techo real de fábrica, no un número inventado.
max_velocity: 500
# [MARLIN REAL] OJO - esto NO es "sin límites": el mismo Configuration.h
# real fija la aceleración de fábrica en 500 (X/Y), no 2500 como teníamos.
# 2500 nunca fue probado por el fabricante en este mecanismo (motores,
# correas, poleas) - y más aceleración de la validada no mejora precisión,
# la empeora (más vibración/ringing en las piezas, que es justo lo
# contrario de lo que se pidió). Si se quiere ir más rápido de verdad sin
# perder detalle, el camino real es Input Shaper (necesita acelerómetro,
# hardware que todavía no tenemos - ver input-shaper-future.cfg), no
# subir este número a ciegas.
max_accel: 500
# [YUMI] Ya está por encima del límite real de Marlin para Z (5mm/s) -
# usamos 25 porque es el valor que la config real de Yumi-Lab usa en
# producción para esta misma placa, probado por más gente que nosotros.
# No se sube más allá de esto - sería terreno sin ninguna validación real.
max_z_velocity: 25
max_z_accel: 100           # [MARLIN REAL] coincide exacto con el real de fábrica
square_corner_velocity: 5.0

####################################################################
# Motores - pines [YUMI] (idénticos en V1.2, V1.3 y Nano-S V1.3)
####################################################################

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: !PA15
position_endstop: 0
position_min: 0
position_max: 230          # [REVISAR] recorrido real de X (spec: 230 mm)
homing_speed: 50

[stepper_y]
step_pin: PE0
dir_pin: !PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: !PA12
position_endstop: 0
position_min: 0
position_max: 230          # [REVISAR] recorrido real de Y (spec: 230 mm)
homing_speed: 50

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
# [NUESTRO - NO TOCAR] pull-up (^) confirmado necesario con prueba
# diferencial real (switch solo, open/TRIGGERED correctos en ambos
# estados) - sin el ^ el pin queda flotando. Ver BITACORA 2026-08-18.
# [2026-11-02] El usuario reemplazó el switch físico de Z por otro
# (el que antes estaba en el eje de la cama), pero en el mismo lugar y
# con el mismo cableado de siempre - el pin no cambia.
endstop_pin: ^!PA11
position_endstop: 0        # [REVISAR] recalibrar offset con procedimiento de papel
position_min: -2
position_max: 250          # [REVISAR] altura real (spec: 250 mm)
homing_speed: 5

####################################################################
# Extrusor T0 - pines [YUMI], calibración [NUESTRO]
####################################################################

[extruder]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
microsteps: 16
# [NUESTRO - NO TOCAR] medido con M400 (confirma movimiento físico real,
# no solo posición lógica): 100mm pedidos -> 100mm reales, 0% de error.
# La base de Yumi-Lab asume un extrusor con caja reductora (gear_ratio
# 3:1, tipo Bondtech/BMG) que ESTA impresora no tiene - copiar ese valor
# a ciegas habría extruido mal.
rotation_distance: 7.623
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC3
sensor_type: ATC Semitec 104GT-2   # [REVISAR] confirmar tipo real de termistor
sensor_pin: PC1
control: pid
# [NUESTRO - NO TOCAR] calibrado con PID_EXTRUDER real en esta unidad
# (ver bloque SAVE_CONFIG al final, que es la fuente de verdad real).
pid_Kp: 24.563
pid_Ki: 0.963
pid_Kd: 156.589
min_temp: 0
max_temp: 250
max_extrude_only_velocity: 60
max_extrude_only_distance: 500
max_extrude_cross_section: 100

# [YUMI] Verificación extra del calentador - detecta más rápido si el
# hotend no calienta como se espera (cable suelto, termistor mal puesto).
[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

####################################################################
# Extrusor T1 - segundo motor que alimenta el MISMO hotend (2 en 1)
# Pines [YUMI] (PA6/PA1/PA3, confirmados también en el ejemplo oficial
# de Klipper). Se usa "extruder_stepper" (forma moderna, NO deprecada)
# en lugar de "shared_heater": T1 no tiene heater ni sensor propios.
####################################################################

[extruder_stepper extruder1]
extruder:
step_pin: PA6
dir_pin: !PA1
enable_pin: !PA3
full_steps_per_rotation: 200
microsteps: 16
# [NUESTRO - NO TOCAR] medido en esta unidad: con 7.474 copiado de T0,
# 100mm pedidos -> 105mm reales. Ajustado = 7.474*(105/100) = 7.848,
# 0% de error verificado.
rotation_distance: 7.848

####################################################################
# Cama caliente - pines [YUMI], calibración [NUESTRO]
####################################################################

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F   # [REVISAR] confirmar tipo real
sensor_pin: PC0
control: pid
# [NUESTRO - NO TOCAR] calibrado con PID_BED real en esta unidad (ver
# SAVE_CONFIG al final).
pid_Kp: 65.585
pid_Ki: 0.951
pid_Kd: 1131.340
min_temp: 0
max_temp: 90                # cama magnética flexible - límite conservador

[fan]
pin: PB1

# [PREPARADO - NO activado] Segundo ventilador auxiliar. PB0 queda libre
# como "FAN1" con 1 solo hotend, pero sale al terminal rotulado "HE1" -
# verificar a mano el jumper de voltaje (12V o 24V) antes de activar.
#[heater_fan auxiliar]
#pin: PB0

####################################################################
# Sensores de corte de filamento - pines PA4/PE6 (fuente oficial de
# Marlin para esta placa). Pull-up (^) agregado - [NUESTRO].
####################################################################

[filament_switch_sensor sensor_t0]
switch_pin: ^PA4
pause_on_runout: True
runout_gcode:
    RESPOND MSG="T0 sin filamento"
insert_gcode:
    RESPOND MSG="T0 filamento detectado"

[filament_switch_sensor sensor_t1]
switch_pin: ^PE6
pause_on_runout: True
runout_gcode:
    RESPOND MSG="T1 sin filamento"
insert_gcode:
    RESPOND MSG="T1 filamento detectado"

####################################################################
# BLTouch - conector dedicado de 5 pines. Sonda "3D Touch" con falla de
# hardware confirmada (BITACORA 2026-08-18) - queda preparado, no activo.
####################################################################

#[bltouch]
#sensor_pin: ^PA11
#control_pin: PA8
#x_offset: 0
#y_offset: 0
#z_offset: 0
#speed: 1
#lift_speed: 1
#sample_retract_dist: 2.0
#samples: 2
#samples_result: average
#samples_tolerance: 0.100
#samples_tolerance_retries: 0
#pin_up_reports_not_triggered: False

[safe_z_home]
home_xy_position: 115, 115
speed: 80.0
z_hop: 10.0
z_hop_speed: 10.0

# [INACTIVO] depende de la sonda (falla de hardware confirmada)
[bed_mesh]
speed: 100
horizontal_move_z: 8
mesh_min: 10, 10
mesh_max: 210, 210
probe_count: 5, 5
fade_start: 1.0
fade_end: 10

[screws_tilt_adjust]
screw1: 30, 30
screw1_name: front left screw
screw2: 200, 30
screw2_name: front right screw
screw3: 200, 200
screw3_name: rear right screw
screw4: 30, 200
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
description: Generar malla de nivelación automática (necesita sonda funcional)
gcode:
    {% if 'probe' not in printer %}
        {action_raise_error("No disponible: no hay sonda configurada. La sonda 3D Touch tiene una falla de hardware confirmada (BITACORA.md, 2026-08-18) y está desconectada. Mientras tanto, usá los botones NIVELAR_ESQUINA_x.")}
    {% else %}
        BED_MESH_CALIBRATE_BASE {rawparams}
    {% endif %}

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: SCREWS_TILT_CALCULATE_BASE
description: Calcular ajuste de tornillos de la cama (necesita sonda funcional)
gcode:
    {% if 'probe' not in printer %}
        {action_raise_error("No disponible: no hay sonda configurada. La sonda 3D Touch tiene una falla de hardware confirmada (BITACORA.md, 2026-08-18) y está desconectada. Mientras tanto, usá los botones NIVELAR_ESQUINA_x.")}
    {% else %}
        SCREWS_TILT_CALCULATE_BASE {rawparams}
    {% endif %}

####################################################################
# Drivers de motor - TMC2209 (X/Y) + A4988 (Z/E0/E1), modo standalone
# (corriente por potenciómetro físico, sin control UART) - así está
# probado y funcionando, igual que en la base de Yumi-Lab.
####################################################################

####################################################################
# idle_timeout y el fix de M84 [YUMI - CANDIDATO A SOLUCIÓN DEL
# PROBLEMA DE ALTURA Z]
#
# Klipper real (stepper_enable.py): M84 apaga TODOS los motores Y
# borra el "homeado" de X/Y/Z (clear_homing_state). Nivelar a mano
# fácilmente supera los 900s de idle_timeout entre ajustes de tornillo,
# lo que dispara un M84 silencioso y un re-home inesperado a mitad de
# la nivelación. Marlin real de esta impresora NUNCA apaga motores por
# inactividad (DISABLE_Z false) - por eso con Marlin nunca pasaba esto.
#
# Este fix (tomado de la config real de Yumi-Lab para esta misma
# impresora) redefine M84 para usar SET_STEPPER_ENABLE por eje (que NO
# borra el homing) en vez del M84 real.
#
# [2026-11-02] [RESUELTO] La duda original era si esto hacía falta que
# el eje Z fuera autoblocante (si no, podía ceder por gravedad sin
# energía). Ya no importa: abajo, stepper_z nunca se apaga, ni siquiera
# en este macro - así que nunca pierde la fuerza que lo sostiene, sea
# autoblocante o no. Confirmado además con QUERY_ENDSTOPS real que el
# homing de los 3 ejes es consistente (ver BITACORA 2026-11-02).
####################################################################

[idle_timeout]
timeout: 900

[gcode_macro M84]
rename_existing: M84.1
# [2026-11-02] A diferencia de la base de Yumi-Lab, stepper_z NO se
# apaga nunca por software - ni acá ni por idle_timeout. Así no importa
# si el eje es autoblocante o no: nunca pierde la fuerza que lo sostiene,
# así que no puede ceder por gravedad. X/Y/extrusor sí se apagan para no
# gastar corriente de más (no tienen ese riesgo).
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
    SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
    SET_STEPPER_ENABLE STEPPER=extruder  enable=0
    SET_KINEMATIC_POSITION

####################################################################
# Retracción por firmware (G10/G11) [NUESTRO]
####################################################################

[firmware_retraction]
retract_length: 3
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 40

####################################################################
# PRINT_START / PRINT_END / PAUSE / RESUME / CANCEL_PRINT [NUESTRO -
# adaptadas para esta impresora, sin depender de plr.cfg que no
# tenemos instalado]
####################################################################

[gcode_macro PRINT_START]
description: Rutina de inicio de impresión, llamar desde el slicer
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M140 S{BED_TEMP}
    M104 S150
    G28
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    G90
    G1 Z5 F600
    G1 X5 Y20 F3000
    G1 Z0.3 F300
    G92 E0
    G1 Y150 E15 F1000
    G1 X5.4 F5000
    G92 E0
    G1 Y20 E15 F1000
    G92 E0
    G1 Z2 F600

[gcode_macro PRINT_END]
description: Rutina de fin de impresión, llamar desde el slicer
gcode:
    M400
    TURN_OFF_HEATERS
    M107
    G91
    G1 Z10 F600
    G90
    G1 X10 Y220 F6000
    M84

[gcode_macro PAUSE]
description: Pausa la impresión actual
rename_existing: PAUSE_BASE
variable_extrude: 1.0
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
    {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-{E} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 Z{z_safe} F900
        G90
        G1 X{x_park} Y{y_park} F6000
    {% else %}
        {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro RESUME]
description: Reanuda la impresión pausada
rename_existing: RESUME_BASE
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91
        G1 E{E} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
description: Cancela la impresión actual
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    G91
    M107
    G1 Z2 F3000
    G90
    M84

[gcode_macro PID_EXTRUDER]
description: Calibra el PID del hotend (recomendado tras el primer flasheo)
gcode:
    M106 S255
    PID_CALIBRATE HEATER=extruder TARGET=210
    M107
    SAVE_CONFIG

[gcode_macro PID_BED]
description: Calibra el PID de la cama
gcode:
    PID_CALIBRATE HEATER=heater_bed TARGET=60
    SAVE_CONFIG

####################################################################
# T0/T1 - [YUMI, simplificado] Sin chequear printer.toolhead.extruder:
# en esta arquitectura (extruder_stepper sincronizado) ese campo SIEMPRE
# reporta "extruder", nunca "extruder1" - confirmado con pruebas reales
# en esta misma impresora. La base de Yumi-Lab no se molesta en
# chequearlo, hace el swap directo - evita el bug donde una guarda
# basada en ese campo nunca dispara. Se mantiene la retracción/purga de
# NUESTRA versión (protección real contra goteo/mezcla en el splitter
# en Y, confirmada necesaria para este diseño "2 motores -> 1 hotend").
#
# [2026-11-02] Probamos bajar esto a 20mm por una expulsión que vimos con
# _FORM_TIP, pero el usuario confirmó que 80mm es la distancia real que
# necesita el splitter en esta máquina - la expulsión fue por acumular
# varios retract/reprime sin una recarga completa real en el medio, no
# porque 80mm sea malo desde una carga fresca. Vuelto a 80mm.
####################################################################

[gcode_macro T0]
gcode:
    SAVE_GCODE_STATE NAME=toolchange_t0
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G92 E0
        G1 E-80 F1500
    {% endif %}
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G92 E0
        G1 E80 F1200
        G92 E0
    {% endif %}
    RESTORE_GCODE_STATE NAME=toolchange_t0
    RESPOND MSG="Extrusor T0 activo"

[gcode_macro T1]
gcode:
    SAVE_GCODE_STATE NAME=toolchange_t1
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G92 E0
        G1 E-80 F1500
    {% endif %}
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G92 E0
        G1 E80 F1200
        G92 E0
    {% endif %}
    RESTORE_GCODE_STATE NAME=toolchange_t1
    RESPOND MSG="Extrusor T1 activo"

# [ELIMINADO 2026-11-02] LOAD/UNLOAD_FILAMENT_T0/T1: el nombre prometía
# actuar sobre un extrusor específico, pero no chequeaban de verdad cuál
# estaba activo (movían el que fuera, sin importar el nombre del macro) -
# inconsistencia real encontrada en la auditoría de hoy. Reemplazadas por
# los botones de jog de abajo, que son honestos sobre qué hacen (actúan
# sobre el extrusor activo, sin fingir ser específicos de uno).

# [DESCARTADO 2026-11-02] _FORM_TIP (moldear la punta antes de retraer)
# se probó con calor real y se descartó a pedido del usuario - nunca tuvo
# problemas de atasco sin ella, no hace falta. Reemplazada por los
# botones de jog manual de abajo.
#
# Botones de jog manual de filamento - [AGREGADO 2026-11-02] A pedido del
# usuario: tocar un botón y que entre/salga filamento de a poco, en 3
# velocidades, para cargar/descargar a mano sin escribir gcode. Actúan
# sobre el extrusor que esté activo en ese momento (T0 o T1, el que se
# haya seleccionado último). 10mm por toque - tocar varias veces para
# mover más. Necesitan hotend caliente (bloqueado si no, para no rayar
# el filamento contra el engranaje en frío).
[gcode_macro FILAMENTO_ADENTRO_LENTO]
description: Entrar 10mm de filamento, lento (5mm/s)
gcode:
    {% if printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Hotend no está a temperatura de extrusión.")}
    {% else %}
        G92 E0
        G1 E10 F300
        G92 E0
    {% endif %}

[gcode_macro FILAMENTO_ADENTRO_MEDIO]
description: Entrar 10mm de filamento, velocidad media (15mm/s)
gcode:
    {% if printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Hotend no está a temperatura de extrusión.")}
    {% else %}
        G92 E0
        G1 E10 F900
        G92 E0
    {% endif %}

[gcode_macro FILAMENTO_ADENTRO_RAPIDO]
description: Entrar 10mm de filamento, rapido (25mm/s)
gcode:
    {% if printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Hotend no está a temperatura de extrusión.")}
    {% else %}
        G92 E0
        G1 E10 F1500
        G92 E0
    {% endif %}

[gcode_macro FILAMENTO_AFUERA_LENTO]
description: Sacar 10mm de filamento, lento (5mm/s)
gcode:
    {% if printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Hotend no está a temperatura de extrusión.")}
    {% else %}
        G92 E0
        G1 E-10 F300
        G92 E0
    {% endif %}

[gcode_macro FILAMENTO_AFUERA_MEDIO]
description: Sacar 10mm de filamento, velocidad media (15mm/s)
gcode:
    {% if printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Hotend no está a temperatura de extrusión.")}
    {% else %}
        G92 E0
        G1 E-10 F900
        G92 E0
    {% endif %}

[gcode_macro FILAMENTO_AFUERA_RAPIDO]
description: Sacar 10mm de filamento, rapido (25mm/s)
gcode:
    {% if printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Hotend no está a temperatura de extrusión.")}
    {% else %}
        G92 E0
        G1 E-10 F1500
        G92 E0
    {% endif %}

####################################################################
# Botones de nivelación manual para Mainsail [NUESTRO]
####################################################################

[gcode_macro _NIVELAR_IR]
gcode:
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G1 Z10 F600
    G1 X{x} Y{y} F3000
    G1 Z1 F300

[gcode_macro NIVELAR]
description: Iniciar nivelación DE CERO - fuerza un home nuevo y va a la esquina 1
gcode:
    G28
    _NIVELAR_IR X=30 Y=30

[gcode_macro NIVELAR_ESQUINA_1]
description: Volver a la esquina 1 SIN rehomear (si ya está homeado)
gcode:
    _NIVELAR_IR X=30 Y=30

[gcode_macro NIVELAR_ESQUINA_2]
description: Ir a la esquina 2 (adelante-derecha)
gcode:
    _NIVELAR_IR X=200 Y=30

[gcode_macro NIVELAR_ESQUINA_3]
description: Ir a la esquina 3 (atrás-derecha)
gcode:
    _NIVELAR_IR X=200 Y=200

[gcode_macro NIVELAR_ESQUINA_4]
description: Ir a la esquina 4 (atrás-izquierda)
gcode:
    _NIVELAR_IR X=30 Y=200

[gcode_macro NIVELAR_CENTRO]
description: Ir al centro para verificar la nivelación
gcode:
    _NIVELAR_IR X=115 Y=115

[gcode_macro ALTURA_SEGURA]
description: Subir Z a una altura segura (10mm), homea si hace falta
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G1 Z10 F600

[gcode_macro FAN_TEST]
description: Probar el ventilador de piezas en 3 velocidades (sin mover nada, sin calentar)
gcode:
    RESPOND MSG="Fan al 30%"
    M106 S76
    G4 P2000
    RESPOND MSG="Fan al 60%"
    M106 S153
    G4 P2000
    RESPOND MSG="Fan al 100%"
    M106 S255
    G4 P2000
    M107
    RESPOND MSG="Fan apagado - prueba terminada"

[gcode_macro ESTADO_CALIBRACION]
description: Mostrar el estado actual de PA, retraccion, rotation_distance e Input Shaper
gcode:
    RESPOND MSG="--- Estado de calibracion ---"
    RESPOND MSG="{"Pressure advance T0: %.3f" % printer.extruder.pressure_advance}"
    RESPOND MSG="{"Rotation distance T0: %.3f mm" % printer.configfile.settings.extruder.rotation_distance}"
    RESPOND MSG="{"Rotation distance T1: %.3f mm" % printer.configfile.settings["extruder_stepper extruder1"].rotation_distance}"
    {% if 'firmware_retraction' in printer %}
        RESPOND MSG="{"Firmware retraction: %.2f mm" % printer.configfile.settings.firmware_retraction.retract_length}"
    {% else %}
        RESPOND MSG="Firmware retraction: no configurado"
    {% endif %}
    {% if 'input_shaper' in printer %}
        RESPOND MSG="Input Shaper: configurado"
    {% else %}
        RESPOND MSG="Input Shaper: NO configurado (falta acelerometro - ver input-shaper-future.cfg)"
    {% endif %}
    {% if 'probe' not in printer %}
        RESPOND MSG="Sonda Z: NO disponible (ver probe-future.cfg)"
    {% endif %}

[gcode_macro DIAGNOSTICO_SENSORES]
description: Mostrar el estado actual de endstops, temperaturas y sensores de filamento
gcode:
    RESPOND MSG="--- Diagnostico de sensores ---"
    RESPOND MSG="{"Homed: %s" % (printer.toolhead.homed_axes if printer.toolhead.homed_axes else "ninguno")}"
    RESPOND MSG="{"Extrusor activo: %s" % ("T1" if printer["extruder_stepper extruder1"].motion_queue else "T0")}"
    RESPOND MSG="{"Extrusor: %.1f C (objetivo %.1f)" % (printer.extruder.temperature, printer.extruder.target)}"
    RESPOND MSG="{"Cama: %.1f C (objetivo %.1f)" % (printer.heater_bed.temperature, printer.heater_bed.target)}"
    RESPOND MSG="{"Sensor filamento T0: %s" % ("filamento detectado" if printer["filament_switch_sensor sensor_t0"].filament_detected else "sin filamento")}"
    RESPOND MSG="{"Sensor filamento T1: %s" % ("filamento detectado" if printer["filament_switch_sensor sensor_t1"].filament_detected else "sin filamento")}"
    {% if 'probe' not in printer %}
        RESPOND MSG="Sonda Z: NO disponible (falla de hardware confirmada, desconectada)"
    {% endif %}
    QUERY_ENDSTOPS

# [AGREGADO 2026-11-02] Verifica, con el switch real (QUERY_ENDSTOPS,
# no un cálculo), que los 3 ejes disparan su fin de carrera exactamente
# en la posición cero - el mismo método que confirmó hoy, a mano con el
# usuario y con el cuchillo, que el homing es consistente. Útil para
# re-chequear esto en cualquier momento sin tener que escribir el gcode
# a mano. Mueve el cabezal - no usar en medio de una impresión.
[gcode_macro VERIFICAR_HOMING]
description: Confirma que X, Y y Z disparan su switch real en la posicion cero
gcode:
    G28
    G1 X0 Y0 F3000
    M400
    RESPOND MSG="--- X/Y en su cero - deben decir TRIGGERED ---"
    QUERY_ENDSTOPS
    G1 Z0 F300
    M400
    RESPOND MSG="--- Z en su cero - debe decir TRIGGERED ---"
    QUERY_ENDSTOPS
    G1 Z10 F600

[gcode_macro DIAGNOSTICO_USB]
description: Mostrar estadisticas de comunicacion con el MCU (retransmisiones, errores)
gcode:
    RESPOND MSG="--- Diagnostico de comunicacion MCU ---"
    RESPOND MSG="{"Bytes retransmitidos: %s" % printer.mcu.last_stats.bytes_retransmit}"
    RESPOND MSG="{"Bytes invalidos: %s" % printer.mcu.last_stats.bytes_invalid}"
    RESPOND MSG="{"MCU awake: %.3f" % printer.mcu.last_stats.mcu_awake}"
    RESPOND MSG="Si esto corrio, la comunicacion esta activa ahora. Para el historial completo de desconexiones, revisar tools/usb_monitor_pasivo*.csv en la netbook."

